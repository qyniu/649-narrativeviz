<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam 恒星图 - The Constellations</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'Aptos', 'Helvetica Neue', sans-serif;
            background: #0a0e27;
            color: #e8e8e8;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .header p {
            font-size: 14px;
            color: #888;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            align-items: center;
            justify-content: center;
        }
        .control-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .control-group label {
            font-size: 12px;
            font-weight: 600;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        button, select {
            padding: 8px 16px;
            background: linear-gradient(135deg, #1f3a93, #1a2d6f);
            border: 1px solid #0099ff;
            color: #00d4ff;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        button:hover, select:hover {
            background: linear-gradient(135deg, #254daa, #1f3a93);
            border-color: #00f4ff;
            color: #00f4ff;
            box-shadow: 0 0 12px rgba(0, 244, 255, 0.5);
        }
        button.active {
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            color: #0a0e27;
            border-color: #00f4ff;
            box-shadow: 0 0 16px rgba(0, 212, 255, 0.6);
        }
        .canvas-container {
            position: relative;
            background: linear-gradient(180deg, #0a0e27 0%, #0d1138 50%, #0a0e27 100%);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: inset 0 0 60px rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.2);
        }
        svg {
            display: block;
            width: 100%;
            height: auto;
        }
        .tooltip {
            position: absolute;
            background: rgba(15, 23, 42, 0.95);
            color: #00d4ff;
            padding: 12px;
            border-radius: 6px;
            font-size: 12px;
            border: 1px solid #0099ff;
            pointer-events: none;
            max-width: 250px;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.3);
            display: none;
        }
        .tooltip.visible {
            display: block;
        }
        .annotations {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 11px;
            color: #888;
            max-width: 300px;
        }
        .annotation-item {
            background: rgba(0, 212, 255, 0.1);
            padding: 8px;
            margin-bottom: 8px;
            border-left: 3px solid #00d4ff;
            border-radius: 3px;
        }
        .legend {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
        }
        .legend-color {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .slider-container {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        input[type="range"] {
            flex: 1;
            height: 4px;
            background: rgba(0, 212, 255, 0.2);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
            accent-color: #00d4ff;
        }
        .year-display {
            min-width: 80px;
            text-align: right;
            font-weight: 600;
            color: #00d4ff;
        }
        .info-box {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 212, 255, 0.05);
            border-left: 4px solid #0099ff;
            border-radius: 6px;
            font-size: 12px;
            color: #aaa;
            line-height: 1.6;
        }
        .pulse-star {
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { 
                r: 3px;
                filter: drop-shadow(0 0 2px rgba(255, 100, 100, 0.6));
            }
            50% { 
                r: 5px;
                filter: drop-shadow(0 0 8px rgba(255, 100, 100, 1));
            }
        }
        .constellation-line {
            stroke: #00d4ff;
            stroke-width: 0.5px;
            opacity: 0.3;
            stroke-dasharray: 4, 4;
            animation: dash 20s linear infinite;
        }
        @keyframes dash {
            to {
                stroke-dashoffset: -100;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌌 Steam 恒星图</h1>
            <p>The Constellations - Discover the Patterns in Steam's Game Universe</p>
        </div>

        <div class="controls">
            <div class="control-group">
                <label>Genre 筛选:</label>
                <select id="genreFilter">
                    <option value="">-- 全部 (重力聚集模式) --</option>
                </select>
            </div>
            <div class="control-group">
                <button id="btnLongevity" class="active">⭐ 长寿星 (10年+10万评论)</button>
                <button id="btnNovae">🔥 新星爆发 (近年指数增长)</button>
            </div>
            <div class="control-group">
                <button id="btnHiddenGems">💎 发现被埋没的宝藏</button>
            </div>
            <div class="control-group">
                <label>时间轴:</label>
                <div class="slider-container">
                    <input type="range" id="yearSlider" min="2008" max="2024" value="2024" step="1">
                    <span class="year-display" id="yearDisplay">2024</span>
                </div>
                <button id="btnPlayTimeline">▶ 播放</button>
            </div>
        </div>

        <div class="canvas-container">
            <svg id="canvas" width="1200" height="700"></svg>
            <div class="annotations" id="annotations"></div>
            <div class="tooltip" id="tooltip"></div>
        </div>

        <div class="legend" id="legend"></div>

        <div class="info-box">
            <strong>💡 怎么互动?</strong><br>
            • 选择Genre时，该类游戏会向中心汇聚，形成星团。其他点变成幽灵般的背景(10%透明度)<br>
            • 切换"长寿星"与"新星爆发"模式，观察不同类型的游戏星群<br>
            • 点击"发现被埋没的宝藏"，筛掉大厂作品，只看小发行商的高分好评游戏<br>
            • 使用时间轴或播放按钮，观看2008-2024年游戏的逐年浮现动画
        </div>
    </div>

    <script>
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // Try to load data from window.__CONSTELLATION_DATA__ (set by notebook)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        
        const rawDataFromNotebook = typeof window.__CONSTELLATION_DATA__ !== 'undefined' ? window.__CONSTELLATION_DATA__ : null;
        
        const genreColors = {
            'Action': '#FF4444',
            'Adventure': '#44FF44',
            'Casual': '#FFAA44',
            'Simulation': '#44AAFF',
            'Strategy': '#FF44FF',
            'RPG': '#FFD700',
            'Sports': '#FF6B6B',
            'Racing': '#FF1493',
            'Free To Play': '#00FFFF',
            'Other': '#888888'
        };

        const genres = Object.keys(genreColors);
        let allData = [];
        let displayData = [];
        let currentYear = 2024;
        let selectedGenre = '';
        let selectedMode = 'longevity';
        let showHiddenGems = false;
        let isPlaying = false;

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // SVG Setup
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        
        const svg = d3.select('#canvas');
        const container = document.querySelector('.canvas-container');
        let width = 1200, height = 700;
        let centerX = width / 2, centerY = height / 2;

        function updateCanvasDimensions() {
            width = container.clientWidth;
            height = Math.min(700, window.innerHeight - 300);
            centerX = width / 2;
            centerY = height / 2;
            svg.attr('width', width).attr('height', height);
        }
        
        updateCanvasDimensions();
        window.addEventListener('resize', updateCanvasDimensions);

        // Deep space background
        svg.append('defs').append('radialGradient')
            .attr('id', 'spaceGradient')
            .selectAll('stop')
            .data([
                { offset: '0%', color: '#1a2a4a' },
                { offset: '50%', color: '#0a0e27' },
                { offset: '100%', color: '#050608' }
            ])
            .enter().append('stop')
            .attr('offset', d => d.offset)
            .attr('stop-color', d => d.color);

        svg.append('rect')
            .attr('width', width)
            .attr('height', height)
            .attr('fill', 'url(#spaceGradient)');

        const layerConstellation = svg.append('g').attr('class', 'layer-constellation');
        const layerStars = svg.append('g').attr('class', 'layer-stars');
        const layerLabels = svg.append('g').attr('class', 'layer-labels');

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // Data Loading
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        
        async function loadData() {
            try {
                if (rawDataFromNotebook) {
                    allData = rawDataFromNotebook.map((d, i) => ({
                        ...d,
                        x: Math.random() * width,
                        y: Math.random() * height,
                        targetX: null,
                        targetY: null
                    }));
                } else {
                    const response = await fetch('steam_constellations_data.json');
                    const rawData = await response.json();
                    allData = rawData.map((d, i) => ({
                        ...d,
                        x: Math.random() * width,
                        y: Math.random() * height,
                        targetX: null,
                        targetY: null
                    }));
                }
                initializeGenreFilter();
                updateVisualization();
            } catch (e) {
                console.error('Data loading failed:', e);
                createSampleData();
            }
        }

        function createSampleData() {
            const sampleGames = [];
            const sampleGenres = ['Action', 'Adventure', 'RPG', 'Simulation', 'Strategy', 'Casual'];
            
            for (let i = 0; i < 300; i++) {
                const genre = sampleGenres[Math.floor(Math.random() * sampleGenres.length)];
                const year = Math.floor(Math.random() * (2024 - 2008 + 1)) + 2008;
                const reviews = Math.floor(Math.exp(Math.random() * Math.log(500000)));
                const yearsDiff = 2024 - year;
                
                sampleGames.push({
                    id: i,
                    name: `Sample Game ${i}`,
                    primary_genre: genre,
                    release_year: year,
                    total_reviews: reviews,
                    is_indie: Math.random() > 0.6,
                    x: Math.random() * width,
                    y: Math.random() * height,
                    targetX: null,
                    targetY: null,
                    longevity_star: reviews > 100000 && yearsDiff > 10,
                    nova: Math.random() > 0.95,
                    hidden_gem: reviews > 50000 && Math.random() > 0.8
                });
            }
            
            allData = sampleGames;
            initializeGenreFilter();
            updateVisualization();
        }

        function initializeGenreFilter() {
            const select = document.getElementById('genreFilter');
            const uniqueGenres = [...new Set(allData.map(d => d.primary_genre))].sort();
            uniqueGenres.forEach(g => {
                const option = document.createElement('option');
                option.value = g;
                option.text = g;
                select.appendChild(option);
            });
            select.addEventListener('change', (e) => {
                selectedGenre = e.target.value;
                updateVisualization();
            });
        }

        function filterData() {
            let filtered = allData;
            
            if (selectedMode === 'longevity') {
                filtered = filtered.filter(d => d.longevity_star);
            } else if (selectedMode === 'novae') {
                filtered = filtered.filter(d => d.nova);
            }

            filtered = filtered.filter(d => d.release_year <= currentYear);

            if (showHiddenGems) {
                filtered = filtered.filter(d => d.hidden_gem);
            }

            return filtered;
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 可视化更新
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        
        function updateVisualization() {
            displayData = filterData();
            
            // 计算目标位置（如果选择了Genre，则向中心汇聚）
            displayData.forEach(d => {
                if (selectedGenre && d.primary_genre === selectedGenre) {
                    // 向中心汇聚
                    const angle = Math.random() * Math.PI * 2;
                    const distance = Math.random() * 150;
                    d.targetX = centerX + Math.cos(angle) * distance;
                    d.targetY = centerY + Math.sin(angle) * distance;
                } else {
                    d.targetX = null;
                    d.targetY = null;
                }
            });

            // 绘制星座连线
            drawConstellation();

            // 绘制星星
            drawStars();

            // 更新图例
            updateLegend();

            // 更新注释
            updateAnnotations();

            // 更新信息框
            updateInfoBox();
        }

        function drawConstellation() {
            layerConstellation.selectAll('*').remove();

            if (selectedMode !== 'longevity') return;

            // 找出所有长寿星
            const longevityStars = displayData.filter(d => d.isLongevityStar);
            
            if (longevityStars.length < 2) return;

            // 简单的Delaunay三角剖分近似：连接距离最近的若干个点
            longevityStars.forEach(star => {
                const distances = longevityStars.map(other => ({
                    other,
                    dist: Math.hypot(star.x - other.x, star.y - other.y)
                })).sort((a, b) => a.dist - b.dist).slice(1, 4); // 连接最近的3个

                distances.forEach(({ other }) => {
                    layerConstellation.append('line')
                        .attr('x1', star.x)
                        .attr('y1', star.y)
                        .attr('x2', other.x)
                        .attr('y2', other.y)
                        .attr('class', 'constellation-line');
                });
            });
        }

        function drawStars() {
            // 背景星（如果选择了Genre）
            if (selectedGenre) {
                const backgroundData = allData.filter(d => 
                    d.primary_genre !== selectedGenre && 
                    d.release_year <= currentYear
                );

                layerStars.selectAll('.star-background').remove();
                layerStars.selectAll('.star-background')
                    .data(backgroundData, d => d.id)
                    .join('circle')
                    .attr('class', 'star-background')
                    .attr('cx', d => d.x)
                    .attr('cy', d => d.y)
                    .attr('r', 2)
                    .attr('fill', d => genreColors[d.primary_genre] || '#888888')
                    .attr('opacity', 0.1);
            }

            // 主星
            const stars = layerStars.selectAll('.star').data(displayData, d => d.id);

            stars.exit().remove();

            stars.enter()
                .append('circle')
                .attr('class', 'star')
                .attr('r', 3)
                .merge(stars)
                .attr('cx', d => {
                    if (d.targetX !== null) {
                        d.x += (d.targetX - d.x) * 0.1;
                        return d.x;
                    }
                    return d.x;
                })
                .attr('cy', d => {
                    if (d.targetY !== null) {
                        d.y += (d.targetY - d.y) * 0.1;
                        return d.y;
                    }
                    return d.y;
                })
                .attr('fill', d => genreColors[d.primary_genre] || '#888888')
                .attr('class', d => {
                    let cls = 'star';
                    if (d.isNova && selectedMode === 'novae') cls += ' pulse-star';
                    return cls;
                })
                .style('filter', d => d.isNova ? 'drop-shadow(0 0 4px rgba(255,100,100,0.8))' : 'none')
                .on('mouseover', function(event, d) {
                    const tooltip = document.getElementById('tooltip');
                    tooltip.innerHTML = `
                        <strong>${d.name}</strong><br>
                        Genre: ${d.primary_genre}<br>
                        Year: ${d.release_year}<br>
                        Reviews: ${d.total_reviews.toLocaleString()}<br>
                        ${d.isLongevityStar ? '⭐ 长寿星' : ''}<br>
                        ${d.isNova ? '🔥 新星爆发' : ''}<br>
                        ${d.isHiddenGem ? '💎 被埋没的宝藏' : ''}
                    `;
                    tooltip.classList.add('visible');
                    tooltip.style.left = (event.pageX + 10) + 'px';
                    tooltip.style.top = (event.pageY + 10) + 'px';
                    d3.select(this).attr('r', 6).attr('stroke', '#00FFFF').attr('stroke-width', 2);
                })
                .on('mouseout', function(d) {
                    document.getElementById('tooltip').classList.remove('visible');
                    d3.select(this).attr('r', 3).attr('stroke', 'none');
                })
                .on('click', function(event, d) {
                    event.stopPropagation();
                });

            // 继续动画帧
            requestAnimationFrame(drawStars);
        }

        function updateLegend() {
            const legend = document.getElementById('legend');
            legend.innerHTML = '';

            genres.forEach(g => {
                const count = displayData.filter(d => d.primary_genre === g).length;
                if (count > 0) {
                    const item = document.createElement('div');
                    item.className = 'legend-item';
                    item.innerHTML = `
                        <div class="legend-color" style="background: ${genreColors[g]}"></div>
                        <span>${g} (${count})</span>
                    `;
                    legend.appendChild(item);
                }
            });
        }

        function updateAnnotations() {
            const annotationsDiv = document.getElementById('annotations');
            annotationsDiv.innerHTML = '';

            // 在右下角标注神作
            const outliers = displayData
                .filter(d => d.release_year <= 2015 && d.total_reviews > 100000)
                .sort((a, b) => b.total_reviews - a.total_reviews)
                .slice(0, 5);

            if (outliers.length > 0) {
                const title = document.createElement('div');
                title.style.fontWeight = '600';
                title.style.marginBottom = '10px';
                title.style.color = '#00d4ff';
                title.textContent = '📌 传奇神作';
                annotationsDiv.appendChild(title);

                outliers.forEach(d => {
                    const item = document.createElement('div');
                    item.className = 'annotation-item';
                    item.innerHTML = `<strong>${d.name}</strong><br><small>${d.release_year} · ${d.total_reviews.toLocaleString()}条评论</small>`;
                    annotationsDiv.appendChild(item);
                });
            }
        }

        function updateInfoBox() {
            const total = displayData.length;
            const longevity = displayData.filter(d => d.isLongevityStar).length;
            const nova = displayData.filter(d => d.isNova).length;
            const gems = displayData.filter(d => d.isHiddenGem).length;
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 控制事件
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        
        document.getElementById('btnLongevity').addEventListener('click', function() {
            selectedMode = 'longevity';
            document.getElementById('btnLongevity').classList.add('active');
            document.getElementById('btnNovae').classList.remove('active');
            updateVisualization();
        });

        document.getElementById('btnNovae').addEventListener('click', function() {
            selectedMode = 'novae';
            document.getElementById('btnNovae').classList.add('active');
            document.getElementById('btnLongevity').classList.remove('active');
            updateVisualization();
        });

        document.getElementById('btnHiddenGems').addEventListener('click', function() {
            showHiddenGems = !showHiddenGems;
            this.classList.toggle('active');
            updateVisualization();
        });

        document.getElementById('yearSlider').addEventListener('input', function(e) {
            currentYear = parseInt(e.target.value);
            document.getElementById('yearDisplay').textContent = currentYear;
            updateVisualization();
        });

        document.getElementById('btnPlayTimeline').addEventListener('click', function() {
            isPlaying = !isPlaying;
            this.textContent = isPlaying ? '⏸ 暂停' : '▶ 播放';
            
            if (isPlaying) {
                const slider = document.getElementById('yearSlider');
                let year = parseInt(slider.value);
                const interval = setInterval(() => {
                    year++;
                    if (year > 2024) {
                        year = 2008;
                    }
                    slider.value = year;
                    currentYear = year;
                    document.getElementById('yearDisplay').textContent = year;
                    updateVisualization();
                }, 500);
                
                this.dataset.interval = interval;
            } else {
                clearInterval(this.dataset.interval);
            }
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 初始化
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        
        loadData();
    </script>
</body>
</html>
