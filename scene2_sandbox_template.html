  function escapeHtml(text) {
    return String(text).replace(/[&<>"]|'/g, (ch) => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    })[ch]);
  }

  function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
  }

  function key(x, y) {

  function resizeCanvas() {
    const availableWidth = Math.max(320, shell.clientWidth - 2);

  function countRecordsUpToYear(year) {
    const capYear = Math.min(year, maxDataYear);
    let index = 0;
    while (index < data.length && data[index].release_year <= capYear) {

    }

  function resetStaticPileToYear(year) {

    state.spawnCursor = targetCount;

    for (let i = 0; i < targetCount; i += 1) {

      const y = view.rows - 1 - rowFromBottom;
      if (y < 0) {

      const x = i % view.cols;
      const particle = {

    state.spawnCursor += 1;
    const particle = {

      x: Math.floor(Math.random() * view.cols),
      y: 0,

    const belowY = particle.y + 1;
    if (belowY >= view.rows) {

    }

    if (!state.occupied.has(key(particle.x, belowY))) {
      particle.y = belowY;
      return;
    }

    const directions = Math.random() < 0.5 ? [-1, 1] : [1, -1];
    for (const direction of directions) {
      const nextX = particle.x + direction;
      if (nextX < 0 || nextX >= view.cols) {
        continue;
      }
      if (!state.occupied.has(key(nextX, belowY))) {
        particle.x = nextX;
        particle.y = belowY;
        return;
      }
    }

    settleParticle(particle, particle.x, particle.y);

  function findHoveredParticle(mouseX, mouseY) {
    const minX = clamp(Math.floor((mouseX - config.brushRadius) / config.cellSize), 0, view.cols - 1);

    const minY = clamp(Math.floor((mouseY - config.brushRadius) / config.cellSize), 0, view.rows - 1);
    const maxY = clamp(Math.floor((mouseY + config.brushRadius) / config.cellSize), 0, view.rows - 1);

    let nearest = null;
    let nearestDistance = Infinity;

    for (let x = minX; x <= maxX; x += 1) {
      for (let y = minY; y <= maxY; y += 1) {
        const particle = state.occupied.get(key(x, y));
        if (!particle) {
          continue;
        }
        const px = (x + 0.5) * config.cellSize;
        const py = (y + 0.5) * config.cellSize;
        const distance = Math.hypot(px - mouseX, py - mouseY);
        if (distance < nearestDistance) {
          nearestDistance = distance;
          nearest = particle;
        }
      }
    }

    return nearestDistance <= config.brushRadius ? nearest : null;
  }

      <div>Zero-review: <strong>${zeroCount.toLocaleString()}</strong></div>
      <div>Has reviews: <strong>${seenCount.toLocaleString()}</strong></div>
      <div>Fall pressure: <strong>${yearPressure(state.year).toFixed(1)}x</strong></div>
    `;
  }

  function animate(now) {
    const dt = Math.min(0.05, Math.max(0.001, (now - state.lastFrame) / 1000));
    state.lastFrame = now;
    const cappedYear = Math.min(state.year, maxDataYear);

    state.emissionBudget += spawnRate(state.year) * dt;
    while (state.emissionBudget >= 1) {
      if (!spawnParticle(cappedYear)) {
        state.emissionBudget = 0;
        break;
      }
      state.emissionBudget -= 1;
    }

    const moveBudget = Math.max(1, Math.round(fallIntensity(state.year) * 5));
    for (const particle of state.particles) {
      if (particle.settled) {
        continue;
      }
      let steps = moveBudget;
      while (steps > 0 && !particle.settled) {
        tryAdvance(particle);
        steps -= 1;
      }
    }

    drawBackground();
    for (const particle of state.particles) {
      drawParticle(particle);
    }

    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,0.86)';
    ctx.font = '13px Segoe UI, sans-serif';
    ctx.fillText('Gray = zero reviews', 18, 26);
    ctx.fillStyle = 'rgba(56,189,248,0.95)';
    ctx.fillText('Sky blue = has reviews', 18, 46);
    ctx.restore();

    updateStats();
    requestAnimationFrame(animate);
  }

  slider.addEventListener('input', () => {
    const newYear = Number(slider.value);
    if (newYear < state.year) {
      resetStaticPileToYear(newYear);
    }
    state.year = newYear;
    yearLabel.textContent = slider.value;
  });

  canvas.addEventListener('mousemove', updatePointer);
  canvas.addEventListener('mouseleave', () => {
    state.pointer.active = false;
    state.hover = null;
    tooltip.style.display = 'none';
  });

  resizeCanvas();
  resetStaticPileToYear(state.year);
  yearLabel.textContent = slider.value;
  window.addEventListener('resize', resizeCanvas);
  requestAnimationFrame(animate);
})();
</script>
